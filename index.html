<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up-form</title>
    <link rel = "stylesheet" href = "style.css">

</head>
<body>
      <!--image-->
    <div class = "side-container">
        <figure>
            <img src = "halie-west-25xggax4bSA-unsplash.jpg" alt = "leaf image" id = "leaf">
            <figcaption>
                <p>
                  Photo by <a href="https://unsplash.com/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
                  >Haile West</a>  On 
                  <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">
                    Unsplash</a>
                </p>
            </figcaption>
        </figure>
            <div>
                <img src = "odin-lined.png" id = "odin">
                <p id = "txt">odin</p>
            </div>
    </div>
    <main>
        <div id = "form-header">
            <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.<br>Sign up <span class="italic">now</span> to get started.<br><br>You <span class="italic">know</span> you want to.
			</p>
        </div>
        <form id = "main-form">
            <p>let's do this !</p>
            <fieldset>
                <legend>Identity</legend>
                <div>
                    <label for = "first-name">FIRST NAME</label>
                    <input type = "text" id = "first-name" placeholder = "penguin">
                </div>
                <div>
                    <label for = "last-name">LAST NAME</label>
                    <input type = "text" id = "last-name" placeholder = "legend">   
                </div>
            </fieldset>
            <fieldset>
                <legend>Coordinates</legend>
                <div>
                    <label for = "email">EMAIL</label>
                    <input type ="email" id = "email" placeholder = "penguin@climber.com">
                </div>
                <div>
                    <label for = "phone-number">Phone Number</label>
                    <input type ="tel" id = "phone-number" placeholder = "999-999-999">
                </div>
            </fieldset>
            <fieldset>
                <legend>Password</legend>
                <div>
                    <label for = "password">PASSWORD</label>
                    <input type = "password" id = "password" >
                </div>
                <div>
                    <label for = "confirm" > CONFIRM</label>
                    <input type = "password" id = "confirm">
                </div>
            </fieldset>
        </form>
        <div id = "form-footer">
            <button type = "submit" form = "main-form">Create Account</button>
            <p>Already have an account ? <a href="https://www.theodinproject.com/sign_in">Log in</a></p>
        </div>
    </main>
    <script src="javas.js"></script>
</body>
</html>
